server:
  port: 8081

spring:
  application:
    name: hermandad-service
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5432/hermandad_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: kafka:29092
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/semana-santa
          jwk-set-uri: http://localhost:8180/realms/semana-santa/protocol/openid-connect/certs

keycloak:
  admin:
    server-url: ${SPRING_KEYCLOAK_ADMIN_SERVER_URL:http://localhost:8180}
    realm: semana-santa
    client-id: admin-cli
    username: admin
    password: admin

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs/hermandad
  swagger-ui:
    path: /swagger-ui.html
    url: /v3/api-docs/hermandad
    oauth:
      client-id: admin-cli
  servers:
    - url: http://localhost:8080
      description: API Gateway

logging:
  level:
    com.repertorio.hermandad: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [${spring.application.name}] %logger{36} - %msg%n"
