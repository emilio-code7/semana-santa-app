global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "hermandad-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["hermandad-service:8081"]

  - job_name: "repertorio-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["repertorio-service:8082"]

  - job_name: "procesion-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["procesion-service:8083"]

  - job_name: "tracking-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["tracking-service:8084"]

  - job_name: "notification-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8085"]
