server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/semana-santa
          jwk-set-uri: http://localhost:8180/realms/semana-santa/protocol/openid-connect/certs
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            # Cruceta routes must precede hermandad's generic /api/hermandades/**
            - id: repertorio-cruceta
              uri: lb://repertorio-service
              predicates:
                - Path=/api/hermandades/*/procesiones/*/cruceta/**
            - id: repertorio-service
              uri: lb://repertorio-service
              predicates:
                - Path=/api/marchas/**
            - id: hermandad-service
              uri: lb://hermandad-service
              predicates:
                - Path=/api/hermandades/**
            - id: hermandad-v3-api-docs
              uri: lb://hermandad-service
              predicates:
                - Path=/v3/api-docs/hermandad
            - id: repertorio-v3-api-docs
              uri: lb://repertorio-service
              predicates:
                - Path=/v3/api-docs/repertorio
            - id: procesion-v3-api-docs
              uri: lb://procesion-service
              predicates:
                - Path=/v3/api-docs/procesion
            - id: procesion-service
              uri: lb://procesion-service
              predicates:
                - Path=/api/procesiones/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    urls:
      - name: Hermandad Service
        url: /v3/api-docs/hermandad
      - name: Procesion Service
        url: /v3/api-docs/procesion
      - name: Repertorio Service
        url: /v3/api-docs/repertorio

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.boot.context.properties: TRACE
    org.springframework.core.env: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [${spring.application.name}] %logger{36} - %msg%n"
