events {
    worker_connections 1024;
}

http {
    # Docker Compose service names (nginx runs in container too)
    upstream hermandad  { server hermandad-service:8081; }
    upstream procesion  { server procesion-service:8082; }
    upstream repertorio { server repertorio-service:8083; }

    server {
        listen 80;
        server_name _;
        client_max_body_size 1M;

        # Procesion
        location /api/procesiones/ {
            proxy_pass http://procesion;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Repertorio — marchas
        location /api/marchas/ {
            proxy_pass http://repertorio;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Repertorio — cruceta (regex overrides prefix location below)
        location ~ ^/api/hermandades/[^/]+/procesiones/[^/]+/cruceta(/|$) {
            proxy_pass http://repertorio;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Hermandad
        location /api/hermandades/ {
            proxy_pass http://hermandad;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
