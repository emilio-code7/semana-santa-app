name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run tests
        run: ./gradlew test

      - name: Validate OpenAPI spec is valid JSON
        run: |
          python3 -c "import json; json.load(open('docs/openapi.yaml')); print('OpenAPI spec valid')"

      - name: Validate OpenAPI spec consistency with controllers
        run: |
          if git diff HEAD~1 --name-only 2>/dev/null | grep -q 'Controller\.java$'; then
            if ! git diff HEAD~1 --name-only | grep -q 'docs/openapi\.yaml$'; then
              echo "⚠️  WARNING: Controller files changed but openapi.yaml did not."
            else
              echo "✅ OpenAPI spec updated alongside controllers."
            fi
          else
            echo "✅ No controller changes in this diff."
          fi

      - name: Shell syntax check demo scripts
        run: |
          bash -n docs/demo/phase-1.sh
          echo "✅ Demo script syntax OK"
