name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate OpenAPI specification
        run: npx --yes @redocly/cli@2.41.0 lint docs/openapi.yaml

      - name: Validate OpenAPI spec consistency with controllers
        run: |
          if git diff HEAD~1 --name-only 2>/dev/null | grep -q 'Controller\.java$'; then
            if ! git diff HEAD~1 --name-only | grep -q 'docs/openapi\.yaml$'; then
              echo "⚠️  WARNING: Controller files changed but openapi.yaml did not."
            else
              echo "✅ OpenAPI spec updated alongside controllers."
            fi
          else
            echo "✅ No controller changes in this diff."
          fi

      - name: Shell syntax check demo scripts
        run: |
          bash -n docs/demo/phase-1.sh
          echo "✅ Demo script syntax OK"

  test:
    needs: validate
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [hermandad-service, procesion-service, repertorio-service]
        include:
          - service: hermandad-service
            db-name: hermandad_db
          - service: procesion-service
            db-name: procesion_db
          - service: repertorio-service
            db-name: repertorio_db

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create test database
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE ${{ matrix.db-name }};"

      - name: Run tests
        run: ./gradlew :services:${{ matrix.service }}:test
        env:
          IT_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ matrix.db-name }}
          IT_DATASOURCE_USERNAME: postgres
          IT_DATASOURCE_PASSWORD: postgres
          JDBC_URL: jdbc:postgresql://localhost:5432/${{ matrix.db-name }}
          JDBC_USER: postgres
          JDBC_PASSWORD: postgres

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/build/reports/tests/

  ci-success:
    needs: [validate, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all CI jobs passed
        if: needs.validate.result != 'success' || needs.test.result != 'success'
        run: |
          echo "CI check failed: validate=${{ needs.validate.result }}, test=${{ needs.test.result }}"
          exit 1
      - run: echo "All CI checks passed"
