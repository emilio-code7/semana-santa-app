name: Build, Push & Deploy

on:
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build
        run: ./gradlew build -x test

      - name: Test
        run: ./gradlew test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push hermandad-service
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $REGISTRY/hermandad-service:${{ github.sha }} -t $REGISTRY/hermandad-service:latest ./services/hermandad-service
          docker push --all-tags $REGISTRY/hermandad-service

      - name: Build & push procesion-service
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $REGISTRY/procesion-service:${{ github.sha }} -t $REGISTRY/procesion-service:latest ./services/procesion-service
          docker push --all-tags $REGISTRY/procesion-service

      - name: Build & push repertorio-service
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $REGISTRY/repertorio-service:${{ github.sha }} -t $REGISTRY/repertorio-service:latest ./services/repertorio-service
          docker push --all-tags $REGISTRY/repertorio-service

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            docker compose -f docker-compose.aws.yml pull
            docker compose -f docker-compose.aws.yml up -d --remove-orphans

      - name: Health check
        run: |
          sleep 30
          curl -sf http://${{ secrets.EC2_HOST }}/health || exit 1
