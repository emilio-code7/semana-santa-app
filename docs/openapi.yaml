{
  "openapi": "3.0.1",
  "info": {
    "title": "Semana Santa API",
    "version": "v0",
    "description": "REST API for Semana Santa Hermandad management"
  },
  "servers": [
    {
      "url": "http://localhost:8080",
      "description": "API Gateway (development)"
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "paths": {
    "/api/hermandades": {
      "post": {
        "tags": [
          "hermandad-controller"
        ],
        "summary": "Create a new hermandad",
        "operationId": "createHermandad",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateHermandadRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "400": {
            "description": "Invalid input (validation error)",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/HermandadResponse"
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized — missing or invalid JWT"
          },
          "403": {
            "description": "Forbidden — insufficient privileges"
          },
          "409": {
            "description": "Hermandad with this name already exists",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/HermandadResponse"
                }
              }
            }
          },
          "201": {
            "description": "Hermandad created",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/HermandadResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/hermandades/{hermandadId}/members": {
      "get": {
        "tags": [
          "hermandad-controller"
        ],
        "summary": "List members of a hermandad",
        "operationId": "getHermandadMembers",
        "parameters": [
          {
            "name": "hermandadId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "List of members",
            "content": {
              "*/*": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/HermandadMember"
                  }
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized — missing or invalid JWT"
          },
          "403": {
            "description": "Forbidden — insufficient privileges"
          },
          "404": {
            "description": "Hermandad not found",
            "content": {
              "*/*": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/HermandadMember"
                  }
                }
              }
            }
          }
        }
      },
      "post": {
        "tags": [
          "hermandad-controller"
        ],
        "summary": "Add a member to a hermandad",
        "operationId": "createHermandadMember",
        "parameters": [
          {
            "name": "hermandadId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AddMemberRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "201": {
            "description": "Member added",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/HermandadMember"
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized — missing or invalid JWT"
          },
          "403": {
            "description": "Forbidden — insufficient privileges"
          },
          "404": {
            "description": "Hermandad not found",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/HermandadMember"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input (validation error or illegal argument)",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/HermandadMember"
                }
              }
            }
          }
        }
      }
    },
    "/api/hermandades/{hermandadId}/members/{userId}/role": {
      "patch": {
        "tags": [
          "hermandad-controller"
        ],
        "summary": "Change a member's role",
        "operationId": "changeHermandadMemberRole",
        "parameters": [
          {
            "name": "hermandadId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "userId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ChangeRoleRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "400": {
            "description": "Invalid input (validation error)",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/HermandadMember"
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized — missing or invalid JWT"
          },
          "403": {
            "description": "Forbidden — insufficient privileges"
          },
          "404": {
            "description": "Member not found in this hermandad",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/HermandadMember"
                }
              }
            }
          },
          "200": {
            "description": "Role updated",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/HermandadMember"
                }
              }
            }
          }
        }
      }
    },
    "/api/hermandades/{hermandadId}": {
      "get": {
        "tags": [
          "hermandad-controller"
        ],
        "summary": "Get a hermandad by ID",
        "operationId": "getHermandad",
        "parameters": [
          {
            "name": "hermandadId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "400": {
            "description": "Invalid ID format",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/HermandadResponse"
                }
              }
            }
          },
          "200": {
            "description": "Hermandad found",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/HermandadResponse"
                }
              }
            }
          },
          "404": {
            "description": "Hermandad not found",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/HermandadResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/procesiones": {
      "post": {
        "tags": ["procesion-controller"],
        "summary": "Create a new procesion",
        "operationId": "createProcesion",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/CreateProcesionRequest" }
            }
          },
          "required": true
        },
        "responses": {
          "201": { "description": "Procesion created", "content": { "*/*": { "schema": { "$ref": "#/components/schemas/ProcesionResponse" } } } },
          "400": { "description": "Invalid input (validation error)" },
          "401": { "description": "Unauthorized — missing or invalid JWT" }
        }
      }
    },
    "/api/procesiones": {
      "get": {
        "tags": ["procesion-controller"],
        "summary": "List procesiones by hermandad (paginated)",
        "operationId": "listByHermandad",
        "parameters": [
          { "name": "hermandadId", "in": "query", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "name": "page", "in": "query", "schema": { "type": "integer", "default": 0 } },
          { "name": "size", "in": "query", "schema": { "type": "integer", "default": 20 } }
        ],
        "responses": {
          "200": {
            "description": "Paginated list of procesiones",
            "content": {
              "*/*": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "content": { "type": "array", "items": { "$ref": "#/components/schemas/ProcesionResponse" } },
                    "totalElements": { "type": "integer" },
                    "totalPages": { "type": "integer" },
                    "number": { "type": "integer" },
                    "size": { "type": "integer" }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/api/procesiones/{id}": {
      "get": {
        "tags": ["procesion-controller"],
        "summary": "Get a procesion by ID",
        "operationId": "getProcesion",
        "parameters": [
          { "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "responses": {
          "200": { "description": "Procesion found", "content": { "*/*": { "schema": { "$ref": "#/components/schemas/ProcesionResponse" } } } },
          "404": { "description": "Procesion not found" }
        }
      },
      "delete": {
        "tags": ["procesion-controller"],
        "summary": "Delete a procesion",
        "operationId": "deleteProcesion",
        "parameters": [
          { "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "responses": {
          "204": { "description": "Procesion deleted" },
          "404": { "description": "Procesion not found" }
        }
      }
    },
    "/api/procesiones/{id}/status": {
      "patch": {
        "tags": ["procesion-controller"],
        "summary": "Change procesion status",
        "operationId": "changeStatus",
        "parameters": [
          { "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/StatusChangeRequest" }
            }
          },
          "required": true
        },
        "responses": {
          "200": { "description": "Status changed", "content": { "*/*": { "schema": { "$ref": "#/components/schemas/ProcesionResponse" } } } },
          "400": { "description": "Invalid status transition" },
          "404": { "description": "Procesion not found" }
        }
      }
    },
    "/api/hermandades/{hermandadId}/members/{userId}": {
      "delete": {
        "tags": [
          "hermandad-controller"
        ],
        "summary": "Delete a member from hermandad",
        "operationId": "deleteHermandadMember",
        "parameters": [
          {
            "name": "hermandadId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "userId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "204": {
            "description": "Member deleted"
          },
          "401": {
            "description": "Unauthorized — missing or invalid JWT"
          },
          "403": {
            "description": "Forbidden — insufficient privileges"
          },
          "404": {
            "description": "Member not found in this hermandad"
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "CreateHermandadRequest": {
        "required": [
          "city",
          "name",
          "foundedYear"
        ],
        "type": "object",
        "properties": {
          "name": {
            "type": "string"
          },
          "city": {
            "type": "string"
          },
          "foundedYear": {
            "minimum": 1,
            "type": "integer",
            "format": "int32"
          },
          "description": {
            "type": "string",
            "nullable": true
          }
        }
      },
      "HermandadResponse": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string"
          },
          "city": {
            "type": "string"
          },
          "foundedYear": {
            "type": "integer",
            "format": "int32"
          },
          "description": {
            "type": "string",
            "nullable": true
          },
          "keycloakGroupId": {
            "type": "string",
            "nullable": true
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "AddMemberRequest": {
        "required": [
          "role",
          "userId"
        ],
        "type": "object",
        "properties": {
          "userId": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "CAPATAZ",
              "HERMANDAD_ADMIN",
              "BAND_DIRECTOR",
              "MUSICIAN"
            ]
          }
        }
      },
      "HermandadMember": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "hermandadId": {
            "type": "string",
            "format": "uuid"
          },
          "userId": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "CAPATAZ",
              "HERMANDAD_ADMIN",
              "BAND_DIRECTOR",
              "MUSICIAN"
            ]
          },
          "joinedAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "CreateProcesionRequest": {
        "required": ["hermandadId", "date", "time"],
        "type": "object",
        "properties": {
          "hermandadId": { "type": "string", "format": "uuid" },
          "date": { "type": "string", "format": "date" },
          "time": { "type": "string", "format": "time" }
        }
      },
      "ProcesionResponse": {
        "type": "object",
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "hermandadId": { "type": "string", "format": "uuid" },
          "date": { "type": "string", "format": "date" },
          "time": { "type": "string", "format": "time" },
          "status": { "type": "string", "enum": ["PLANNED", "IN_PROGRESS", "COMPLETED", "CANCELLED"] },
          "createdAt": { "type": "string", "format": "date-time" },
          "updatedAt": { "type": "string", "format": "date-time" }
        }
      },
      "StatusChangeRequest": {
        "required": ["newStatus"],
        "type": "object",
        "properties": {
          "newStatus": {
            "type": "string",
            "enum": ["PLANNED", "IN_PROGRESS", "COMPLETED", "CANCELLED"]
          }
        }
      },
      "ChangeRoleRequest": {
        "required": [
          "role"
        ],
        "type": "object",
        "properties": {
          "role": {
            "type": "string",
            "enum": [
              "CAPATAZ",
              "HERMANDAD_ADMIN",
              "BAND_DIRECTOR",
              "MUSICIAN"
            ]
          }
        }
      }
    },
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "description": "Paste your Keycloak access token here.\n\nGet one via:\n  curl -s -X POST http://localhost:8180/realms/semana-santa/protocol/openid-connect/token \\\n    -d \"grant_type=password&client_id=semana-santa-client&client_secret=secret&username=qa-admin-user&password=test\" \\\n    | jq -r '.access_token'",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    }
  }
}
